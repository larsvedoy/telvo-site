    const EXCLUDED = new Set(["ERP", "Personalsystem"]);

    // Slugify function for /moduler/ URLs
    function slugify(txt) {
      return txt
        .normalize('NFD').replace(/\p{Diacritic}/gu, '')
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-');
    }

    // Insert SVG
    const stage = document.getElementById('stage');
    stage.innerHTML = rawSVG;
    const svg = stage.querySelector('svg');

    // Wrap all content in a <g id="zoomRoot"> for zooming
    const zoomRoot = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    zoomRoot.setAttribute('id', 'zoomRoot');
    while (svg.firstChild) zoomRoot.appendChild(svg.firstChild);
    svg.appendChild(zoomRoot);

    // Collect candidate text nodes (module labels)
    const texts = Array.from(svg.querySelectorAll('text')).filter(t => (t.textContent || '').trim().length > 0);

    // Create an overlay layer on top
    const overlayLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    overlayLayer.setAttribute('id', 'overlayLayer');
    overlayLayer.setAttribute('style', 'pointer-events:none;');
    zoomRoot.appendChild(overlayLayer);

    // Helper to add overlay for each text label
    texts.forEach(t => {
      const label = t.textContent.trim();
      if (!label) return;

      let bbox;
      try {
        bbox = t.getBBox();
      } catch (e) {
        return;
      }
      // Padding around the text to cover the whole box
      const padX = Math.max(8, bbox.width * 0.15);
      const padY = Math.max(6, bbox.height * 0.6);
      const x = bbox.x - padX/2;
      const y = bbox.y - padY/2;
      const w = bbox.width + padX;
      const h = bbox.height + padY;

      const clickable = !EXCLUDED.has(label);

      // Build overlay group
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'overlay');
      g.setAttribute('style', 'pointer-events:all;');

      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x);
      rect.setAttribute('y', y);
      rect.setAttribute('width', w);
      rect.setAttribute('height', h);
      rect.setAttribute('rx', 8);
      rect.setAttribute('ry', 8);
      rect.setAttribute('class', 'overlay-rect');

      // Tooltip
      const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      title.textContent = (clickable ? "Klikk for mer informasjon om " : "Informasjon om ") + label;

      if (clickable) {
        const a = document.createElementNS('http://www.w3.org/2000/svg', 'a');
        a.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '/moduler/' + slugify(label));
        a.setAttribute('target', '_self');
        a.appendChild(title);
        a.appendChild(rect);
        g.appendChild(a);
      } else {
        g.appendChild(title);
        g.appendChild(rect);
      }

      overlayLayer.appendChild(g);
    });

    // Simple zoom controls using viewBox manipulation
    function getViewBox() {
      const vb = svg.getAttribute('viewBox');
      if (vb) return vb.split(' ').map(parseFloat);
      // If no viewBox, set one based on bounding box
      const bb = zoomRoot.getBBox();
      const initial = [bb.x, bb.y, Math.max(800, bb.width), Math.max(600, bb.height)];
      svg.setAttribute('viewBox', initial.join(' '));
      return initial;
    }

    let viewBox = getViewBox();

    function setViewBox(vb) {
      viewBox = vb;
      svg.setAttribute('viewBox', vb.join(' '));
    }

    function zoom(factor, centerX=null, centerY=null) {
      const [x, y, w, h] = viewBox;
      const cx = centerX ?? (x + w/2);
      const cy = centerY ?? (y + h/2);
      const newW = w * factor;
      const newH = h * factor;
      const newX = cx - newW/2;
      const newY = cy - newH/2;
      setViewBox([newX, newY, newW, newH]);
    }

    document.getElementById('zoomIn').addEventListener('click', () => zoom(0.85));
    document.getElementById('zoomOut').addEventListener('click', () => zoom(1.15));
    document.getElementById('zoomReset').addEventListener('click', () => {
      const bb = zoomRoot.getBBox();
      setViewBox([bb.x, bb.y, Math.max(800, bb.width), Math.max(600, bb.height)]);
    });

    // Mouse wheel zoom with cursor focus
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const scale = e.deltaY < 0 ? 0.9 : 1.1;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const ctm = svg.getScreenCTM().inverse();
      const p = pt.matrixTransform(ctm);
      zoom(scale, p.x, p.y);
    }, { passive: false });
