<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moduler – Telvo</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    color: #222;
    background: #f7f7f7;
  }

  /* --- Toppmeny --- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  header .logo {
    font-weight: 600;
    letter-spacing: 0.5px;
    font-size: 1.2rem;
    color: #222;
    text-decoration: none;
  }
  nav a {
    color: #222;
    text-decoration: none;
    margin-left: 1.5rem;
    font-weight: 500;
    transition: opacity 0.2s;
  }
  nav a:hover {
    opacity: 0.7;
  }
  nav .btn {
    background: #7c1125;
    color: #fff;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    margin-left: 1.5rem;
  }

  /* --- Diagram-container --- */
  main {
    height: calc(100vh - 80px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #stage {
    flex: 1;
    overflow: auto;
    background: #f7f7f7;
  }
  svg {
    display: block;
    margin: 0 auto;
    max-width: 1600px;
    height: auto;
  }

  /* --- Zoom toolbar (floating) --- */
  .zoom-toolbar {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    padding: 0.5rem;
    z-index: 20;
  }
  .zoom-toolbar button {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .zoom-toolbar button:hover {
    background: #eee;
  }

  /* --- Tilbakeknapp --- */
  footer {
    text-align: center;
    padding: 1rem 0;
  }
  footer a {
    text-decoration: none;
    color: #7c1125;
    font-weight: 500;
  }

  /* --- Tooltip + klikk --- */
  .overlay-rect {
    fill: transparent;
    pointer-events: all;
  }
  .overlay-rect:hover {
    outline: 1px dashed rgba(124,17,37,0.3);
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">TELVO</a>
  <nav>
    <a href="/om.html">Om</a>
    <a href="/moduler/" class="active">Moduler</a>
    <a href="/hvorfor.html">Hvorfor Telvo</a>
    <a href="/kontakt.html" class="btn">Kontakt</a>
  </nav>
</header>

<main>
  <div id="stage"></div>
</main>

<div class="zoom-toolbar">
  <button id="zoomIn">＋</button>
  <button id="zoomOut">－</button>
  <button id="zoomReset">⟳</button>
</div>

<footer>
  <a href="/">← Tilbake til forsiden</a>
</footer>

<script>
  const svgUrl = '/assets/Telvo-Page-1.drawio.svg';
  const EXCLUDED = new Set(["ERP", "Personalsystem"]);

  async function loadSVG() {
    const res = await fetch(svgUrl);
    const svgText = await res.text();
    const stage = document.getElementById('stage');
    stage.innerHTML = svgText;
    const svg = stage.querySelector('svg');

    const zoomRoot = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    while (svg.firstChild) zoomRoot.appendChild(svg.firstChild);
    svg.appendChild(zoomRoot);

    const overlayLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    overlayLayer.setAttribute('id', 'overlayLayer');
    overlayLayer.setAttribute('style', 'pointer-events:none;');
    zoomRoot.appendChild(overlayLayer);

    const texts = Array.from(svg.querySelectorAll('text')).filter(t => (t.textContent || '').trim().length > 0);

    function slugify(txt) {
      return txt
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // kompatibel regex
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-');
    }

    texts.forEach(t => {
      const label = t.textContent.trim();
      if (!label) return;
      let bbox;
      try { bbox = t.getBBox(); } catch { return; }

      const padX = Math.max(8, bbox.width * 0.15);
      const padY = Math.max(6, bbox.height * 0.6);
      const x = bbox.x - padX / 2;
      const y = bbox.y - padY / 2;
      const w = bbox.width + padX;
      const h = bbox.height + padY;

      const clickable = !EXCLUDED.has(label);

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('style', 'pointer-events:all;');

      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x);
      rect.setAttribute('y', y);
      rect.setAttribute('width', w);
      rect.setAttribute('height', h);
      rect.setAttribute('rx', 8);
      rect.setAttribute('ry', 8);
      rect.setAttribute('class', 'overlay-rect');

      const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      title.textContent = (clickable ? "Klikk for mer informasjon om " : "Informasjon om ") + label;

      if (clickable) {
        const a = document.createElementNS('http://www.w3.org/2000/svg', 'a');
        a.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '/moduler/' + slugify(label));
        a.setAttribute('target', '_self');
        a.appendChild(title);
        a.appendChild(rect);
        g.appendChild(a);
      } else {
        g.appendChild(title);
        g.appendChild(rect);
      }

      overlayLayer.appendChild(g);
    });

    // Zoom-funksjoner
    function getViewBox() {
      const vb = svg.getAttribute('viewBox');
      if (vb) return vb.split(' ').map(parseFloat);
      const bb = zoomRoot.getBBox();
      const initial = [bb.x, bb.y, Math.max(800, bb.width), Math.max(600, bb.height)];
      svg.setAttribute('viewBox', initial.join(' '));
      return initial;
    }

    let viewBox = getViewBox();
    function setViewBox(vb) { viewBox = vb; svg.setAttribute('viewBox', vb.join(' ')); }

    function zoom(factor, cx = null, cy = null) {
      const [x, y, w, h] = viewBox;
      const centerX = cx ?? (x + w / 2);
      const centerY = cy ?? (y + h / 2);
      const newW = w * factor;
      const newH = h * factor;
      const newX = centerX - newW / 2;
      const newY = centerY - newH / 2;
      setViewBox([newX, newY, newW, newH]);
    }

    document.getElementById('zoomIn').addEventListener('click', () => zoom(0.85));
    document.getElementById('zoomOut').addEventListener('click', () => zoom(1.15));
    document.getElementById('zoomReset').addEventListener('click', () => {
      const bb = zoomRoot.getBBox();
      setViewBox([bb.x, bb.y, Math.max(800, bb.width), Math.max(600, bb.height)]);
    });

    svg.addEventListener('wheel', e => {
      e.preventDefault();
      const scale = e.deltaY < 0 ? 0.9 : 1.1;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const ctm = svg.getScreenCTM().inverse();
      const p = pt.matrixTransform(ctm);
      zoom(scale, p.x, p.y);
    }, { passive: false });
  }

  loadSVG();
</script>
